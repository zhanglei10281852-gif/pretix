rubrics:
  - id: 1
    type: f2p
    text: "每个到期计划时隙按计划与应执行时间形成唯一持久执行，并冻结导出类型、筛选配置、语言、时区和收件设置；立即运行创建独立且可区分的执行。"
  - id: 2
    type: f2p
    text: "重复周期扫描、事务提交与任务发布交错、任务重投和并发 worker 只会认领或接管同一执行，不会为一个计划时隙派发两个活动任务。"
  - id: 3
    type: f2p
    text: "渲染前中断可安全重做；结果已写入 CachedFile 后恢复会复用该文件；邮件已创建 OutgoingMail 后恢复只继续原邮件，不重复生成附件、邮件或成功日志。"
  - id: 4
    type: f2p
    text: "空结果维持软失败语义，权限丢失、无效配置和内部异常分别记录可查询原因，错误计数与失败通知对同一执行只结算一次且恢复动作互不混淆。"
  - id: 5
    type: f2p
    text: "达到现有连续失败阈值后不再自动创建新执行，修复配置后的人工运行或后续时隙不会重发已经成功完成的历史执行。"
  - id: 6
    type: f2p
    text: "计划列表或等价查询能关联展示执行状态、结果文件、邮件和日志；未终态文件不会被清理，终态附件按现有 OutgoingMail 与 CachedFile 规则释放。"
  - id: 7
    type: p2p
    text: "无故障执行继续保持 RRULE 与夏令时计算、用户和事件权限、repeatable-read、To/Cc/Bcc 规则、文件大小限制以及活动级和主办方级导出内容。"
