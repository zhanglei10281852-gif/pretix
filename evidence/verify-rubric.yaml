rubrics:
  - id: 1
    type: f2p
    text: "每个 webhook 通知首次排队时形成唯一持久投递身份，并冻结当时的目标地址、事件类型和 JSON 请求内容，业务对象后续修改或删除不会改变待重试请求。"
  - id: 2
    type: f2p
    text: "短延迟重试、数据库延迟重试、周期扫描和管理员立即重试均延续同一投递及其尝试计数，修改地址或订阅范围只影响之后新产生的通知。"
  - id: 3
    type: f2p
    text: "周期扫描、人工加速、任务重投和并发 worker 对同一投递只能有一个可接管的活动尝试，发布失败或进程中断不会删除待处理状态，也不会产生并行副本。"
  - id: 4
    type: f2p
    text: "2xx 响应只生成一个成功终态；网络异常和非成功响应继续既有退避；410 会停用 webhook 并终止该投递，重复执行不会追加第二个终态结果。"
  - id: 5
    type: f2p
    text: "管理员停用 webhook 或放弃重试会终止相应待处理项，重新启用或编辑配置不会悄悄复活已终止投递，仍有效的其他投递不受影响。"
  - id: 6
    type: f2p
    text: "控制台能把同一投递的历次尝试、冻结目标和等待、尝试中、成功、放弃、端点停用等状态关联展示，清理任务保留重试窗口内所需快照并安全清除终态数据。"
  - id: 7
    type: p2p
    text: "无故障且未修改配置的 webhook 继续遵守现有事件与活动范围筛选、约三天退避节奏、响应正文大小限制、调用历史和 REST 配置行为。"
